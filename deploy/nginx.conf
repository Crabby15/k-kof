server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /jasa-dekat/;
    }

    location = /jasa-dekat {
        return 301 /jasa-dekat/;
    }

    location /jasa-dekat/ {
        try_files $uri $uri/ /jasa-dekat/index.html;
    }
}
